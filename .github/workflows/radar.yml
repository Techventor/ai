name: AI OSS radar

# Momentum needs history, and history only exists if this runs on a
# schedule. The SQLite snapshot store is committed back to the repo so each
# run can diff against the previous ones, and the site is redeployed from
# the fresh data so the published page needs no separate refresh.
on:
  schedule:
    - cron: "37 6 * * *"   # daily, off the hour to dodge scheduler congestion
  workflow_dispatch:
    inputs:
      quick:
        description: "Core topics only (much faster)"
        type: boolean
        default: false

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet requests

      - name: Unit tests
        run: python tests/test_core.py

      # This workflow runs with no setup at all. RADAR_TOKEN is optional and
      # only raises the enrichment budget: the automatic GITHUB_TOKEN allows
      # 1000 core requests/hour and each repo costs ~3, so without a PAT the
      # shortlist is capped well under that. Search is 30/min for any token,
      # so stage 1 -- and therefore the breadth of the rankings -- is the
      # same either way.
      - name: Pick the enrichment budget
        env:
          RADAR_TOKEN: ${{ secrets.RADAR_TOKEN }}
        run: |
          if [ -n "$RADAR_TOKEN" ]; then
            echo "ENRICH_TOP=250" >> "$GITHUB_ENV"
            echo "Using RADAR_TOKEN (5000 core req/hour): enriching 250 repos."
          else
            echo "ENRICH_TOP=120" >> "$GITHUB_ENV"
            echo "No RADAR_TOKEN set, using the built-in GITHUB_TOKEN"
            echo "(1000 core req/hour): enriching 120 repos."
            echo "Add a RADAR_TOKEN secret to raise this -- see the README."
          fi

      - name: Scan
        env:
          GITHUB_TOKEN: ${{ secrets.RADAR_TOKEN || secrets.GITHUB_TOKEN }}
          QUICK: ${{ inputs.quick }}
        run: |
          args=(--db data/aiscout.db scan --out reports --enrich-top "$ENRICH_TOP")
          [ "$QUICK" = "true" ] && args+=(--quick)
          python -m aiscout "${args[@]}"

      - name: Build the site data
        run: |
          python scripts/flatten.py reports/latest.json site/radar-rows.json \
            --run-out site/radar-run.json

      - name: Commit reports, snapshots and site data
        run: |
          git config user.name  "ai-oss-radar"
          git config user.email "noreply@github.com"
          git add reports data/aiscout.db site
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "radar: $(date -u +%Y-%m-%d) scan"
            # The schedule is serialised by `concurrency`, but a human push
            # can still land first, so rebase rather than fail the run.
            pushed=
            for i in 1 2 3; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
                 && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=yes
                break
              fi
              sleep $((i * 5))
            done
            [ -n "$pushed" ] || { echo "could not push after 3 attempts" >&2; exit 1; }
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-reports
          path: reports/
          retention-days: 90

  # A separate job, so a Pages problem cannot lose the scan: by the time
  # this runs, the data is already committed.
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - if: failure()
        run: |
          echo "::error::Pages deploy failed. If this is the first run, turn"
          echo "::error::Pages on: repository Settings -> Pages -> Build and"
          echo "::error::deployment -> Source -> GitHub Actions. The scan"
          echo "::error::itself succeeded and its data is already committed."
          exit 1
